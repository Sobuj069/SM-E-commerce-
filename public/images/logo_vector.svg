<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 115" width="460" height="115" fill="none">
  <defs>
    <!-- Metallic 3D Gold Gradient -->
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="55%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Dynamic Tech Orange Accent Gradient -->
    <linearGradient id="orangeSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="40%" stop-color="#EF4A23" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Group with Shadow Filter -->
  <g filter="url(#softShadow)">
    
    <!-- Top & Left Sweeping Golden Luxury Arc -->
    <path d="M 28 86 C 10 56, 16 22, 54 10 C 96 -3, 195 4, 305 28 C 275 22, 180 12, 105 19 C 52 25, 34 52, 48 76 C 58 92, 85 98, 120 96 C 158 94, 202 84, 240 70" 
          stroke="url(#goldArc)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Speed Spark Highlight on Gold Arc -->
    <path d="M 46 13 C 82 3, 155 7, 230 22" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.75" />

    <!-- Bottom Dynamic Tech Red/Orange Underline Swoosh -->
    <path d="M 38 90 C 72 106, 150 106, 260 88 C 328 77, 395 54, 442 26" 
          stroke="url(#orangeSwoosh)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Glowing Tech Node Dot -->
    <circle cx="442" cy="26" r="4" fill="#EF4A23" />
    <circle cx="442" cy="26" r="2" fill="#FFFFFF" />

    <!-- Typography: SM Shop -->
    <!-- SM (Bold White with Gold Reflection) -->
    <text x="68" y="70" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="54" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="-1">
      SM
    </text>

    <!-- Shop (Clean Premium White) -->
    <text x="172" y="70" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="54" 
          font-weight="800" 
          fill="#FFFFFF" 
          letter-spacing="-0.5">
      Shop
    </text>

    <!-- Tech Dot Badge -->
    <circle cx="328" cy="58" r="5" fill="#EF4A23" />
    <circle cx="328" cy="58" r="2" fill="#FFFFFF" />

    <!-- Subtitle: COMPUTER • LAPTOP • GADGET -->
    <text x="70" y="93" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11.5" 
          font-weight="800" 
          fill="url(#goldText)" 
          letter-spacing="4.5">
      COMPUTER • LAPTOP • GADGET
    </text>
  </g>
</svg>