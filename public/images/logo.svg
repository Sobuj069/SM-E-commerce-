<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="500" height="130" fill="none">
  <style>
    .brand-title {
      font-family: "Playfair Display", "Georgia", "Times New Roman", serif;
      font-weight: 900;
      font-size: 50px;
      fill: #000000;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-family: "Inter", "Plus Jakarta Sans", "Montserrat", sans-serif;
      font-weight: 800;
      font-size: 14.5px;
      fill: #000000;
      letter-spacing: 5.5px;
    }
  </style>

  <!-- Left: Bold Tailoring Compass / Caliper Icon in Pure Black -->
  <g transform="translate(10, 8)">
    <!-- Top Pivot Ring -->
    <circle cx="48" cy="24" r="14" stroke="#000000" stroke-width="8" fill="#FFFFFF" />
    <circle cx="48" cy="24" r="6" fill="#000000" />
    
    <!-- Left Leg -->
    <line x1="42" y1="36" x2="12" y2="108" stroke="#000000" stroke-width="8.5" stroke-linecap="round" />
    
    <!-- Right Leg -->
    <line x1="54" y1="36" x2="84" y2="108" stroke="#000000" stroke-width="8.5" stroke-linecap="round" />
    
    <!-- Fine Needle Tip Accents -->
    <circle cx="12" cy="108" r="4.25" fill="#000000" />
    <circle cx="84" cy="108" r="4.25" fill="#000000" />
  </g>

  <!-- Right: Bold Deep Black Typography -->
  <text x="125" y="66" class="brand-title">SM Shop</text>
  <text x="128" y="98" class="brand-sub">FASHION &amp; APPAREL</text>
</svg>