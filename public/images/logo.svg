<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="smGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="smGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF0055" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Dynamic Athletic Shark Fin & Fabric Wave -->
  <g filter="url(#glow)">
    <!-- Primary Shark Fin Swell -->
    <path d="M15 80 C25 65, 38 45, 52 20 C58 10, 68 8, 72 16 C76 24, 70 38, 58 50 C48 60, 42 68, 40 82 C30 84, 20 83, 15 80 Z" fill="url(#smGrad1)" />
    
    <!-- Secondary Interlocking Activewear Curve (S-M Flow) -->
    <path d="M42 45 C50 35, 65 30, 80 32 C86 33, 88 40, 84 46 C76 58, 62 68, 50 78 C54 68, 52 58, 42 45 Z" fill="url(#smGrad2)" opacity="0.95" />

    <!-- Sharp Dynamic S-Slash Accent -->
    <path d="M30 68 C40 55, 55 48, 70 44 C62 54, 52 64, 38 74 C34 72, 31 70, 30 68 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>